name: sport-activities-features

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install ruff
        run: python -m pip install ruff

      - name: Ruff (errors only)
        run: ruff check --select E9,F63,F7,F82 --output-format github .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Install Poetry
        run: pipx install "poetry>=2.0,<3.0"

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Configure Poetry environment
        run: poetry env use "${{ steps.setup-python.outputs.python-path }}"

      - name: Check lock file
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --with test --no-interaction

      - name: Run tests
        run: >
          poetry run pytest -v
          -k 'not test_overpy_node_manipulation and not test_weather'
